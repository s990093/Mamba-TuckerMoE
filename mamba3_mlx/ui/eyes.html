      name="apple-mobile-web-app-status-bar-style"

    <div class="scene" id="scene">
      <!-- Background atmosphere -->
      <div class="bg-glow" id="bg-glow" aria-hidden="true"></div>

      <!-- Mascot stage -->
      <div
        class="eyes-stage"
        id="eyes-stage"
        aria-label="Mamba voice assistant"
        role="main"
      >
        <!-- ═══ Pixel-art mascot ═══════════════════════════════════════ -->
        <svg
          class="mascot"
          id="mascot"
          viewBox="0 0 200 170"
          shape-rendering="crispEdges"
          xmlns="http://www.w3.org/2000/svg"
        >
          <!-- BODY (always visible) -->
          <g class="m-body" fill="#cc785c">
            <!-- head top (narrower) — +1px height to overlap mid seam -->
            <rect x="30" y="0" width="140" height="21" />
            <!-- middle band (widens) — extend 1px each side to cover seams -->
            <rect x="10" y="19" width="180" height="52" />
            <!-- head bottom (narrower) — start 1px early to overlap mid seam -->
            <rect x="30" y="69" width="140" height="21" />
            <!-- legs -->
            <rect class="leg leg-1" x="30" y="90" width="20" height="40" />
            <rect class="leg leg-2" x="70" y="90" width="20" height="40" />
            <rect class="leg leg-3" x="110" y="90" width="20" height="40" />
            <rect class="leg leg-4" x="150" y="90" width="20" height="40" />
          </g>

          <!-- ═══ EYE VARIANTS (only one shown per state via CSS) ═══ -->

          <!-- Default vertical slits -->
          <g class="m-eyes m-eyes-idle" fill="#0d0c0b">
            <rect x="60" y="30" width="10" height="30" />
            <rect x="130" y="30" width="10" height="30" />
          </g>

          <!-- Mid-blink (short horizontal bar) -->
          <g class="m-eyes m-eyes-blink" fill="#0d0c0b">
            <rect x="55" y="40" width="20" height="5" />
            <rect x="125" y="40" width="20" height="5" />
          </g>

          <!-- Wink left (left closed, right open) -->
          <g class="m-eyes m-eyes-wink-l" fill="#0d0c0b">
            <rect x="55" y="40" width="20" height="5" />
            <rect x="130" y="30" width="10" height="30" />
          </g>

          <!-- Wink right -->
          <g class="m-eyes m-eyes-wink-r" fill="#0d0c0b">
            <rect x="60" y="30" width="10" height="30" />
            <rect x="125" y="40" width="20" height="5" />
          </g>

          <!-- Wide attentive (listening) -->
          <g class="m-eyes m-eyes-wide" fill="#0d0c0b">
            <rect x="55" y="25" width="20" height="40" />
            <rect x="125" y="25" width="20" height="40" />
          </g>

          <!-- Looking up (thinking) -->
          <g class="m-eyes m-eyes-up" fill="#0d0c0b">
            <rect x="60" y="25" width="10" height="15" />
            <rect x="130" y="25" width="10" height="15" />
          </g>

          <!-- Looking left -->
          <g class="m-eyes m-eyes-left" fill="#0d0c0b">
            <rect x="50" y="30" width="10" height="30" />
            <rect x="120" y="30" width="10" height="30" />
          </g>

          <!-- Looking right -->
          <g class="m-eyes m-eyes-right" fill="#0d0c0b">
            <rect x="70" y="30" width="10" height="30" />
            <rect x="140" y="30" width="10" height="30" />

            <rect x="60" y="40" width="10" height="10" />
            <rect x="130" y="40" width="10" height="10" />

            <rect x="65" y="35" width="10" height="10" />
            <rect x="125" y="45" width="10" height="10" />
            <rect x="135" y="35" width="10" height="10" />

            <rect x="55" y="30" width="10" height="10" />
            <rect x="70" y="30" width="10" height="10" />
            <rect x="62.5" y="40" width="10" height="10" />

            <rect x="70" y="50" width="10" height="10" />
            <!-- right X -->

            <rect x="140" y="50" width="10" height="10" />

          <!-- Sleep (closed long bars) -->
          <g class="m-eyes m-eyes-sleep" fill="#0d0c0b">
            <rect x="50" y="42" width="30" height="6" />
            <rect x="120" y="42" width="30" height="6" />

          <!-- ═══ MOUTH VARIANTS (only shown in speaking state) ═══ -->
          <g class="m-mouth m-mouth-open" fill="#0d0c0b">
            <rect x="80" y="68" width="40" height="14" />

          <!-- ═══ Pixel heart (upper-left, hidden by default) ═══ -->

            font-size="14"
            font-weight="bold"
          >
            <text x="155" y="20">z</text>
            <text x="170" y="8">z</text>
