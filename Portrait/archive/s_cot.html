<!-- s_cot.html — Edge Application -->
<div class="sec s">
  <div class="sh">Edge Application — Real-Time On-Device AI Assistant</div>
  <div class="sc" style="padding: 2mm 3mm">
    <div style="display: flex; gap: 3.5mm; align-items: stretch;">
      <!-- LEFT: photo -->
      <div style="flex: 0 0 20%; display: flex; flex-direction: column; align-items: center;">
        <img
          src="assets/user_story2.png"
          style="
            width: 100%;
            border-radius: 6px;
            display: block;
            object-fit: cover;
            border: 1.5px solid #98A9D1;
          "
          alt="Mamba Edge AI Assistant on Apple Silicon"
        />
        <div style="font-size:13.0pt;font-weight:700;color:#1B2A47;text-align:center;margin-top:1.5mm;">
          Mamba · Edge
        </div>
        <div style="font-size:10.4pt;color:#4B5563;text-align:center;font-style:italic;">
          Apple Silicon · Fully Offline
        </div>
      </div>

      <!-- RIGHT: Visual FSM + Guards -->
      <div style="flex: 1; min-width: 0;">
        <svg viewBox="0 0 560 160" xmlns="http://www.w3.org/2000/svg"
             style="width:100%;display:block;font-family:'Times New Roman',Times,serif;">

          <defs>
            <filter id="sh"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.12"/></filter>
            <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
              <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#1B2A47"/>
            </marker>
            <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
              <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#1B5E34"/>
            </marker>
            <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
              <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#8A3324"/>
            </marker>
          </defs>

          <!-- ═══ FSM Pipeline — Top ═══ -->

          <!-- Box: prompt -->
          <rect x="4" y="8" width="52" height="44" rx="8" fill="#E8EDF5" stroke="#1B2A47" stroke-width="2" filter="url(#sh)"/>
          <text x="30" y="26" font-size="16" fill="#1B2A47" text-anchor="middle" font-weight="800">PROMPT</text>
          <text x="30" y="40" font-size="9" fill="#4B5563" text-anchor="middle" font-weight="600">user input</text>

          <line x1="56" y1="30" x2="78" y2="30" stroke="#1B2A47" stroke-width="2.5" marker-end="url(#a)"/>

          <!-- Box: <think> with icon -->
          <rect x="78" y="4" width="76" height="52" rx="8" fill="#98A9D1" stroke="#1B2A47" stroke-width="2" filter="url(#sh)"/>
          <text x="116" y="22" font-size="16" fill="#1B2A47" text-anchor="middle" font-weight="800">&lt;think&gt;</text>
          <text x="116" y="36" font-size="9.5" fill="#1B2A47" text-anchor="middle" font-weight="600">think</text>
          <text x="116" y="48" font-size="8.5" fill="#4B5563" text-anchor="middle">enter</text>

          <line x1="154" y1="30" x2="176" y2="30" stroke="#1B2A47" stroke-width="2.5" marker-end="url(#a)"/>

          <!-- Box: reasoning with icon (brain/loop) -->
          <rect x="176" y="4" width="88" height="52" rx="8" fill="#E8EDF5" stroke="#1B2A47" stroke-width="2" filter="url(#sh)"/>
          <!-- loop icon -->
          <circle cx="204" cy="28" r="8" fill="none" stroke="#1B2A47" stroke-width="2"/>
          <line x1="198" y1="22" x2="210" y2="34" stroke="#1B2A47" stroke-width="1.8"/>
          <line x1="198" y1="34" x2="210" y2="22" stroke="#1B2A47" stroke-width="1.8" opacity="0.4"/>
          <text x="245" y="22" font-size="15" fill="#1B2A47" text-anchor="middle" font-weight="800">reasoning</text>
          <text x="245" y="36" font-size="9" fill="#1B2A47" font-weight="600">CoT step-by-step</text>
          <text x="245" y="48" font-size="8.5" fill="#4B5563">think tokens</text>

          <line x1="264" y1="30" x2="286" y2="30" stroke="#1B2A47" stroke-width="2.5" marker-end="url(#a)"/>

          <!-- Box: </think> -->
          <rect x="286" y="4" width="72" height="52" rx="8" fill="#D8B868" stroke="#1B2A47" stroke-width="2" filter="url(#sh)"/>
          <text x="322" y="22" font-size="16" fill="#1B2A47" text-anchor="middle" font-weight="800">&lt;/think&gt;</text>
          <text x="322" y="36" font-size="9.5" fill="#1B2A47" text-anchor="middle" font-weight="600">think</text>
          <text x="322" y="48" font-size="8.5" fill="#4B5563" text-anchor="middle">exit</text>

          <line x1="358" y1="30" x2="380" y2="30" stroke="#1B5E34" stroke-width="2.5" marker-end="url(#ag)"/>

          <!-- Box: <final> injection with lightning bolt -->
          <rect x="380" y="4" width="72" height="52" rx="8" fill="#1B5E34" stroke="#1B5E34" stroke-width="2" filter="url(#sh)"/>
          <!-- lightning bolt -->
          <polygon points="412,12 408,28 414,28 410,44 420,24 414,24 418,12" fill="#D8B868"/>
          <text x="416" y="55" font-size="9" fill="#D1F0DB" text-anchor="middle" font-weight="600">inject</text>

          <line x1="452" y1="30" x2="474" y2="30" stroke="#1B5E34" stroke-width="2.5" marker-end="url(#ag)"/>

          <!-- Box: answer with checkmark -->
          <rect x="474" y="4" width="76" height="52" rx="8" fill="#1B5E34" stroke="#1B5E34" stroke-width="2" filter="url(#sh)"/>
          <!-- checkmark circle -->
          <circle cx="496" cy="24" r="10" fill="none" stroke="#D8B868" stroke-width="2.5"/>
          <polyline points="491,24 495,28 501,19" fill="none" stroke="#D8B868" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="529" y="22" font-size="14" fill="#FFF" text-anchor="middle" font-weight="800">answer</text>
          <text x="529" y="36" font-size="9.5" fill="#D1F0DB" text-anchor="middle" font-weight="600">&lt;/final&gt;</text>
          <text x="529" y="48" font-size="8.5" fill="#D1F0DB" text-anchor="middle">done / EOS</text>

          <!-- ═══ Three Guard badges — Bottom ═══ -->
          <line x1="4" y1="74" x2="556" y2="74" stroke="#98A9D1" stroke-width="1.5" stroke-dasharray="6,4"/>

          <!-- Guard 1: Format Guard -->
          <rect x="4" y="82" width="180" height="70" rx="8" fill="#FFF9F0" stroke="#8A3324" stroke-width="2.2" filter="url(#sh)"/>
          <rect x="4" y="82" width="40" height="70" rx="8" fill="#8A3324"/>
          <rect x="36" y="82" width="8" height="70" fill="#8A3324"/>
          <text x="24" y="121" font-size="18" fill="#FFF" text-anchor="middle" font-weight="900" transform="rotate(-90,24,121)">GUARD</text>
          <text x="56" y="100" font-size="14" fill="#1B2A47" font-weight="800">Format Guard</text>
          <text x="56" y="115" font-size="10.5" fill="#1B2A47" font-family="monospace">ban &lt;|im_start|&gt; &lt;/s&gt;</text>
          <text x="56" y="130" font-size="10.5" fill="#1B2A47" font-family="monospace">close_bias 4 → 16 ramp</text>
          <text x="56" y="145" font-size="10" fill="#8A3324" font-style="italic">forces valid CoT structure</text>

          <!-- Guard 2: Watchdog -->
          <rect x="190" y="82" width="178" height="70" rx="8" fill="#E8EDF5" stroke="#1B2A47" stroke-width="2.2" filter="url(#sh)"/>
          <rect x="190" y="82" width="40" height="70" rx="8" fill="#1B2A47"/>
          <rect x="222" y="82" width="8" height="70" fill="#1B2A47"/>
          <!-- eye/watchdog icon -->
          <text x="210" y="102" font-size="22" text-anchor="middle">👁</text>
          <text x="242" y="100" font-size="14" fill="#1B2A47" font-weight="800">Watchdog</text>
          <text x="242" y="115" font-size="10.5" fill="#1B2A47" font-family="monospace">think_tok &ge; 2000</text>
          <text x="242" y="130" font-size="10.5" fill="#8A3324" font-family="monospace">→ force_done()</text>
          <text x="242" y="145" font-size="10" fill="#1B2A47" font-style="italic">prevents infinite loops</text>

          <!-- Guard 3: Token Budget -->
          <rect x="374" y="82" width="182" height="70" rx="8" fill="#E8EDF5" stroke="#1B5E34" stroke-width="2.2" filter="url(#sh)"/>
          <rect x="374" y="82" width="40" height="70" rx="8" fill="#1B5E34"/>
          <rect x="406" y="82" width="8" height="70" fill="#1B5E34"/>
          <text x="394" y="105" font-size="24" fill="#D8B868" text-anchor="middle" font-weight="900">⊞</text>
          <text x="426" y="100" font-size="14" fill="#1B2A47" font-weight="800">Token Budget</text>
          <text x="426" y="115" font-size="10.5" fill="#1B2A47" font-family="monospace">reasoning_budget = 2000</text>
          <text x="426" y="130" font-size="10.5" fill="#1B2A47" font-family="monospace">final_min_tokens = 16</text>
          <text x="426" y="145" font-size="10" fill="#1B5E34" font-style="italic">prevents empty answers</text>

        </svg>
      </div>
    </div>
  </div>
</div>
