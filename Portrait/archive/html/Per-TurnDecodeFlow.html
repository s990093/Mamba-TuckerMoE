<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Times New Roman", Times, serif;
      background: #fff;
      color: #1B2A47;
      padding: 0;
    }
    .title-bar {
      background: #1B2A47;
      color: #fff;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 800;
      text-align: center;
      padding: 3px 6px;
    }
    .svg-wrap { padding: 3px 5px 2px; }
  </style>
</head>
<body>

<div class="title-bar">Per-Turn Decode Flow — <span style="font-family:'Courier New',monospace;font-size:10px;">cot_middleware.py</span></div>

<div class="svg-wrap">
<svg viewBox="0 0 464 82" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;display:block;font-family:'Times New Roman',Times,serif;">
  <defs>
    <marker id="ar"  markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 L1,3 Z" fill="#1B2A47"/></marker>
    <marker id="arG" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 L1,3 Z" fill="#1B5E34"/></marker>
    <marker id="arR" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 L1,3 Z" fill="#8A3324"/></marker>
  </defs>

  <!-- ==== Top Row: Main Pipeline ==== -->

  <!-- model logits -->
  <rect x="4" y="4" width="52" height="28" rx="3" fill="#E8EDF5" stroke="#1B2A47" stroke-width="1.2"/>
  <text x="30" y="16" font-size="7.5" fill="#1B2A47" text-anchor="middle" font-weight="700">model</text>
  <text x="30" y="26" font-size="6.5" fill="#4B5563" text-anchor="middle">logits</text>

  <line x1="56" y1="18" x2="64" y2="18" stroke="#1B2A47" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- ① transform_logits -->
  <rect x="64" y="2" width="82" height="34" rx="3" fill="#1B2A47"/>
  <text x="105" y="15" font-size="7.5" fill="#FFF" text-anchor="middle" font-weight="700">① transform_logits</text>
  <text x="105" y="26" font-size="6.5" fill="#D8B868" text-anchor="middle">FormatGuard(ban+close_bias)</text>

  <line x1="146" y1="18" x2="156" y2="18" stroke="#1B2A47" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- sample -->
  <rect x="156" y="4" width="56" height="28" rx="3" fill="#E8EDF5" stroke="#1B2A47" stroke-width="1.2"/>
  <text x="184" y="16" font-size="7.5" fill="#1B2A47" text-anchor="middle" font-weight="700">sample</text>
  <text x="184" y="26" font-size="6.5" fill="#4B5563" text-anchor="middle">→ tid</text>

  <line x1="212" y1="18" x2="222" y2="18" stroke="#1B2A47" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- ③ step → FSM -->
  <rect x="222" y="2" width="100" height="34" rx="3" fill="#98A9D1" stroke="#1B2A47" stroke-width="1.2"/>
  <text x="272" y="15" font-size="7.5" fill="#1B2A47" text-anchor="middle" font-weight="700">③ FSM step(tid)</text>
  <text x="272" y="26" font-size="6.5" fill="#1B2A47" text-anchor="middle">decode + splitter.feed</text>

  <line x1="322" y1="18" x2="332" y2="18" stroke="#1B2A47" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- ④ inject_final (triggered between) -->
  <rect x="332" y="2" width="64" height="34" rx="3" fill="#1B5E34"/>
  <text x="364" y="15" font-size="7" fill="#FFF" text-anchor="middle" font-weight="700">④ inject</text>
  <text x="364" y="26" font-size="6" fill="#D1F0DB" text-anchor="middle">&lt;final&gt; prefill</text>

  <line x1="396" y1="18" x2="406" y2="18" stroke="#1B5E34" stroke-width="1.5" marker-end="url(#arG)"/>

  <!-- ⑥ Events -->
  <rect x="406" y="2" width="54" height="34" rx="3" fill="#9374B1"/>
  <text x="433" y="15" font-size="7" fill="#FFF" text-anchor="middle" font-weight="700">⑥ Events</text>
  <text x="433" y="26" font-size="6" fill="#D8B868" text-anchor="middle">→ UI stream</text>

  <!-- ==== FSM State Chain (compact, bottom band) ==== -->
  <rect x="4" y="44" width="456" height="34" rx="3" fill="#E8EDF5" stroke="#98A9D1" stroke-width="1"/>

  <!-- head -->
  <rect x="16" y="50" width="34" height="15" rx="7" fill="#fff" stroke="#1B2A47" stroke-width="1.2"/>
  <text x="33" y="60" font-size="6.5" fill="#1B2A47" text-anchor="middle" font-weight="600">head</text>
  <line x1="50" y1="57" x2="58" y2="57" stroke="#1B2A47" stroke-width="1" marker-end="url(#ar)"/>

  <!-- think -->
  <rect x="58" y="50" width="36" height="15" rx="7" fill="#98A9D1" stroke="#1B2A47" stroke-width="1.2"/>
  <text x="76" y="60" font-size="6.5" fill="#1B2A47" text-anchor="middle" font-weight="700">think</text>
  <line x1="94" y1="57" x2="102" y2="57" stroke="#1B2A47" stroke-width="1" marker-end="url(#ar)"/>

  <!-- between -->
  <rect x="102" y="50" width="46" height="15" rx="7" fill="#D8B868" stroke="#1B2A47" stroke-width="1.2"/>
  <text x="125" y="60" font-size="6.5" fill="#1B2A47" text-anchor="middle" font-weight="700">between</text>
  <rect x="107" y="66" width="36" height="9" rx="2" fill="#1B5E34"/>
  <text x="125" y="73" font-size="5" fill="#FFF" text-anchor="middle" font-weight="600">④ inject</text>
  <line x1="148" y1="57" x2="156" y2="57" stroke="#1B2A47" stroke-width="1" marker-end="url(#ar)"/>

  <!-- final -->
  <rect x="156" y="50" width="36" height="15" rx="7" fill="#1B5E34"/>
  <text x="174" y="60" font-size="6.5" fill="#FFF" text-anchor="middle" font-weight="700">final</text>
  <line x1="192" y1="57" x2="200" y2="57" stroke="#1B2A47" stroke-width="1" marker-end="url(#ar)"/>

  <!-- done -->
  <rect x="200" y="50" width="34" height="15" rx="7" fill="#1B2A47"/>
  <text x="217" y="60" font-size="6.5" fill="#FFF" text-anchor="middle" font-weight="700">done</text>

  <!-- Watchdog note -->
  <text x="270" y="75" font-size="6" fill="#8A3324">think_tok ≥ 2000 → force_done() · FCP EOS penalty in think zone</text>

  <!-- EOS note -->
  <text x="416" y="60" font-size="6" fill="#1B2A47" text-anchor="middle">EOS /</text>
  <text x="416" y="70" font-size="6" fill="#1B2A47" text-anchor="middle">stop → done</text>

</svg>
</div>
</body>
</html>
