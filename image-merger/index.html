<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Image Merger - 左右合併工具</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Image Merger</h1>
            <p class="subtitle">將兩張照片左右合併，輸出高品質圖片</p>
        </header>

        <main>
            <div class="upload-section">
                <div class="drop-zone" id="drop-zone-1">
                    <div class="icon-content">
                        <i class="fas fa-image"></i>
                        <span>左側照片</span>
                        <p style="font-size: 0.8rem; color: #64748b; margin-top: 0.5rem;">點擊或拖放</p>
                    </div>
                    <img id="img-1" src="" alt="Left preview">
                    <input type="file" id="file-1" accept="image/*">
                </div>

                <div class="drop-zone" id="drop-zone-2">
                    <div class="icon-content">
                        <i class="fas fa-image"></i>
                        <span>右側照片</span>
                        <p style="font-size: 0.8rem; color: #64748b; margin-top: 0.5rem;">點擊或拖放</p>
                    </div>
                    <img id="img-2" src="" alt="Right preview">
                    <input type="file" id="file-2" accept="image/*">
                </div>
            </div>

            <div class="controls">
                <button id="merge-btn" class="btn btn-primary">
                    <i class="fas fa-layer-group"></i> 合併照片
                </button>
                <button id="reset-btn" class="btn btn-secondary">
                    <i class="fas fa-undo"></i> 重置
                </button>
            </div>

            <div class="preview-container" id="preview-container">
                <h3 style="margin-bottom: 1rem;">合併預覽</h3>
                <canvas id="result-canvas"></canvas>
                <div class="controls" style="margin-top: 1.5rem;">
                    <button id="download-btn" class="btn btn-primary">
                        <i class="fas fa-download"></i> 下載合併後的照片
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="main.js"></script>
</body>
</html>
